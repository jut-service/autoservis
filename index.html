<!DOCTYPE html>
<html lang="sk">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Autoservis – plánovač</title>
  <style>
    :root{--bg:#f3f5f8;--panel:#fff;--ink:#172033;--muted:#6b7485;--line:#e4e8ef;--blue:#2457d6;--blue2:#eaf0ff;--green:#16845b;--orange:#b76a0b;--red:#c0393d}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif}
    button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}
    .topbar{height:64px;background:#14213b;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 24px;box-shadow:0 3px 15px #0e1a3020}
    .brand{font-weight:800;font-size:17px;letter-spacing:.2px}.brand span{color:#8fb0ff}.top-actions{display:flex;gap:12px;align-items:center;color:#dce5f8}
    .wrap{max-width:1440px;margin:26px auto;padding:0 22px}.login-wrap{max-width:420px;margin:9vh auto;padding:0 18px}
    .panel{background:var(--panel);border:1px solid var(--line);border-radius:15px;box-shadow:0 5px 22px #14213b08}
    .login{padding:30px}.login h1{margin:0 0 5px;font-size:25px}.sub{color:var(--muted);margin:0 0 24px}
    label{display:block;font-weight:650;margin:13px 0 6px;font-size:13px}input,select,textarea{width:100%;border:1px solid #d9deea;border-radius:9px;padding:10px 11px;background:#fff;color:var(--ink);outline:none}
    input:focus,select:focus,textarea:focus{border-color:#7192ed;box-shadow:0 0 0 3px #2457d614}textarea{resize:vertical;min-height:75px}
    .btn{border:0;border-radius:9px;padding:10px 14px;background:var(--blue);color:white;font-weight:700}.btn:hover{filter:brightness(.96)}
    .btn.secondary{background:#edf1f8;color:#28364f}.btn.danger{background:#fff0f0;color:var(--red)}.btn.small{padding:7px 10px;font-size:12px}
    .login .btn{width:100%;margin-top:20px;padding:12px}.error{color:var(--red);margin-top:12px;min-height:18px}
    .headrow{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:20px;flex-wrap:wrap}.headrow h1{font-size:25px;margin:0}.muted{color:var(--muted)}
    .tabs{display:flex;gap:7px;margin-bottom:17px;flex-wrap:wrap}.tab{border:1px solid var(--line);background:#fff;border-radius:9px;padding:9px 13px;color:#47536a;font-weight:650}.tab.active{background:var(--blue2);border-color:#cbd8ff;color:#204bb7}
    .toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.toolbar input{width:auto}.week-label{font-weight:750;min-width:180px;text-align:center}
    .stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px;margin-bottom:17px}.stat{padding:16px 18px}.stat .num{font-size:25px;font-weight:800}.stat .caption{color:var(--muted);font-size:12px}
    .calendar{overflow:auto}.calgrid{min-width:850px;display:grid;grid-template-columns:160px repeat(7,minmax(100px,1fr))}
    .calhead,.calname,.calcell{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:10px}
    .calhead{background:#f8faff;font-weight:750;text-align:center}.calname{font-weight:750;background:#fbfcfe;display:flex;align-items:flex-start;gap:8px}
    .dot{width:8px;height:8px;border-radius:50%;background:#4f78df;margin-top:5px;flex:none}.calcell{min-height:125px;background:#fff}
    .job{border-radius:8px;padding:7px 8px;margin:0 0 7px;background:#edf2ff;border-left:3px solid #4771db;font-size:12px}
    .job strong{display:block;font-size:12px}.job .time{color:#5c6680}.job.status-Rozpracované{background:#fff4df;border-color:#d88b22}.job.status-Dokončené{background:#e6f6ee;border-color:#21966b}
    .job.mine{background:#edf2ff}.empty{color:#a0a7b4;font-size:12px}
    .section{padding:20px}.section h2{font-size:17px;margin:0 0 15px}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:650px}th,td{text-align:left;padding:11px 10px;border-bottom:1px solid var(--line)}th{color:var(--muted);font-size:12px;background:#fafbfd}
    .badge{display:inline-block;padding:4px 8px;border-radius:20px;font-size:11px;font-weight:700;background:#edf1f8}.badge.done{background:#e5f5ed;color:#13744e}.badge.work{background:#fff1d9;color:#995b08}
    .grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 12px}.span2{grid-column:1/-1}
    .modalback{position:fixed;inset:0;background:#0d172a80;display:flex;align-items:center;justify-content:center;padding:18px;z-index:5}.modal{width:min(620px,100%);max-height:92vh;overflow:auto;padding:22px}.modalhead{display:flex;justify-content:space-between;align-items:center}.modalhead h2{margin:0}.modalactions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
    .notice{background:#fff7e7;border:1px solid #f0dfb9;color:#77520e;padding:11px 13px;border-radius:9px;margin-bottom:15px}
    .mobilejobs{display:none}
    @media(max-width:700px){.topbar{padding:0 14px}.wrap{padding:0 12px;margin:17px auto}.stats{gap:7px}.stat{padding:12px}.stat .num{font-size:20px}.headrow h1{font-size:21px}.grid2,.formgrid{grid-template-columns:1fr}.span2{grid-column:auto}.desktop-only{display:none}.mobilejobs{display:block}.calgrid{min-width:850px}}
  </style>
</head>
<body>
  <header class="topbar"><div class="brand">AUTO<span>SERVIS</span> <span style="color:#cbd6ec;font-weight:500">/ plánovač</span></div><div class="top-actions"><span id="who"></span><button id="logoutBtn" class="btn secondary small hidden" onclick="logout()">Odhlásiť</button></div></header>

  <main id="loginView" class="login-wrap">
    <div class="panel login">
      <h1>Prihlásenie</h1><p class="sub">Plánovanie práce v autoservise</p>
      <form onsubmit="event.preventDefault(); doLogin()">
        <label>Prihlasovacie meno</label><input id="loginUser" autocomplete="username" required value="">
        <label>Heslo</label><input id="loginPass" type="password" autocomplete="current-password" required>
        <button class="btn" type="submit">Prihlásiť sa</button><div id="loginError" class="error"></div>
      </form>
    </div>
  </main>

  <main id="appView" class="wrap hidden">
    <div class="headrow"><div><h1 id="pageTitle">Prehľad dielne</h1><div class="muted" id="pageSub">Týždenný plán zákaziek</div></div><div class="toolbar" id="adminActions"><button class="btn" onclick="openJob()">+ Naplánovať auto</button><button class="btn secondary" onclick="openVehicle()">+ Vozidlo</button><button class="btn secondary" onclick="openMechanic()">+ Mechanik</button></div></div>
    <div class="tabs" id="tabs">
      <button class="tab active" data-tab="calendar" onclick="showTab('calendar')">Kalendár</button>
      <button class="tab" data-tab="vehicles" onclick="showTab('vehicles')">Vozidlá</button>
      <button class="tab" data-tab="mechanics" onclick="showTab('mechanics')">Mechanici</button>
      <button class="tab" data-tab="password" onclick="showTab('password')">Zmena hesla</button>
    </div>
    <div id="calendarTab">
      <div class="stats">
        <div class="panel stat"><div class="num" id="statJobs">0</div><div class="caption">Zákazky v zobrazenom týždni</div></div>
        <div class="panel stat"><div class="num" id="statMechanics">0</div><div class="caption">Aktívni mechanici</div></div>
        <div class="panel stat"><div class="num" id="statDone">0</div><div class="caption">Dokončené zákazky</div></div>
      </div>
      <div class="panel section">
        <div class="headrow"><div class="toolbar"><button class="btn secondary small" onclick="shiftWeek(-1)">←</button><button class="btn secondary small" onclick="goToday()">Dnes</button><button class="btn secondary small" onclick="shiftWeek(1)">→</button><span class="week-label" id="weekLabel"></span></div></div>
        <div class="calendar"><div id="calendarGrid" class="calgrid"></div></div>
      </div>
      <div class="mobilejobs panel section" style="margin-top:14px"><h2>Pridelené zákazky</h2><div id="mobileJobList"></div></div>
    </div>
    <div id="vehiclesTab" class="panel section hidden"><div class="headrow"><h2>Zoznam vozidiel</h2><button class="btn" onclick="openVehicle()">+ Pridať vozidlo</button></div><div class="tablewrap" id="vehicleTable"></div></div>
    <div id="mechanicsTab" class="panel section hidden"><div class="headrow"><h2>Mechanici</h2><button class="btn" onclick="openMechanic()">+ Pridať mechanika</button></div><div class="tablewrap" id="mechanicTable"></div></div>
    <div id="passwordTab" class="panel section hidden"><h2>Zmena hesla</h2><div style="max-width:430px"><label>Aktuálne heslo</label><input id="oldPass" type="password"><label>Nové heslo (min. 8 znakov)</label><input id="newPass" type="password"><button class="btn" style="margin-top:16px" onclick="changePassword()">Uložiť nové heslo</button></div></div>
  </main>

  <div id="modalBack" class="modalback hidden" onclick="if(event.target===this)closeModal()"><div class="panel modal"><div class="modalhead"><h2 id="modalTitle"></h2><button class="btn secondary small" onclick="closeModal()">✕</button></div><div id="modalBody"></div></div></div>
  <script>
    let token = sessionStorage.getItem('as_token') || '';
    let me = null, data = {users:[],mechanics:[],vehicles:[],jobs:[]}, weekStart = monday(new Date()), activeTab='calendar';
    const $ = id => document.getElementById(id);
    const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    function call(name,...args){return new Promise((resolve,reject)=>google.script.run.withSuccessHandler(resolve).withFailureHandler(e=>reject(new Error(e.message||e)))[name](...args));}
    async function doLogin(){
      $('loginError').textContent='';
      try{const r=await call('login',$('loginUser').value,$('loginPass').value);token=r.token;sessionStorage.setItem('as_token',token);me=r.user;await loadData();}
      catch(e){$('loginError').textContent=e.message;}
    }
    async function logout(){try{await call('logout',token)}catch(e){}token='';sessionStorage.removeItem('as_token');me=null;$('appView').classList.add('hidden');$('loginView').classList.remove('hidden');$('logoutBtn').classList.add('hidden');$('who').textContent='';}
    async function loadData(){
      try{data=await call('getAppData',token);me=data.user;$('loginView').classList.add('hidden');$('appView').classList.remove('hidden');$('logoutBtn').classList.remove('hidden');$('who').textContent=me.name+' · '+(me.role==='admin'?'Admin':'Dielňa');$('adminActions').classList.toggle('hidden',me.role!=='admin');$('tabs').querySelector('[data-tab="vehicles"]').classList.toggle('hidden',me.role!=='admin');$('tabs').querySelector('[data-tab="mechanics"]').classList.toggle('hidden',me.role!=='admin');renderAll();}
      catch(e){$('loginError').textContent=e.message;token='';sessionStorage.removeItem('as_token');$('loginView').classList.remove('hidden');$('appView').classList.add('hidden');}
    }
    function renderAll(){renderCalendar();renderVehicles();renderMechanics();}
    function monday(d){const x=new Date(d);x.setHours(0,0,0,0);x.setDate(x.getDate()+(1-(x.getDay()||7)));return x;}
    function dateKey(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
    function plusDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x;}
    function fmt(d){return d.toLocaleDateString('sk-SK',{day:'numeric',month:'numeric'});}
    function shiftWeek(n){weekStart=plusDays(weekStart,n*7);renderCalendar();}
    function goToday(){weekStart=monday(new Date());renderCalendar();}
    function showTab(tab){activeTab=tab;['calendar','vehicles','mechanics','password'].forEach(t=>$(t+'Tab').classList.toggle('hidden',t!==tab));document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));$('pageTitle').textContent=({calendar:'Prehľad dielne',vehicles:'Vozidlá',mechanics:'Mechanici',password:'Zmena hesla'})[tab];}
    function vehicle(id){return data.vehicles.find(v=>v.id===id)||{}}
    function mechanic(id){return data.mechanics.find(m=>m.id===id)||{}}
    function renderCalendar(){
      const days=Array.from({length:7},(_,i)=>plusDays(weekStart,i)), end=plusDays(weekStart,6);
      $('weekLabel').textContent=fmt(weekStart)+' – '+fmt(end)+' '+end.getFullYear();
      const mechanics=me.role==='admin'?data.mechanics:[me];
      const jobs=data.jobs.filter(j=>j.date>=dateKey(weekStart)&&j.date<=dateKey(end));
      $('statJobs').textContent=jobs.length;$('statMechanics').textContent=mechanics.length;$('statDone').textContent=jobs.filter(j=>j.status==='Dokončené').length;
      let html='<div class="calhead">Mechanik</div>'+days.map(d=>'<div class="calhead">'+['Ne','Po','Ut','St','Št','Pi','So'][d.getDay()]+'<br>'+fmt(d)+'</div>').join('');
      mechanics.forEach(m=>{html+='<div class="calname"><span class="dot"></span>'+esc(m.name)+'</div>';days.forEach(d=>{const ds=dateKey(d),list=jobs.filter(j=>j.mechanicId===m.id&&j.date===ds).sort((a,b)=>a.startTime.localeCompare(b.startTime));html+='<div class="calcell">'+(list.length?list.map(j=>jobCard(j)).join(''):'<span class="empty">Voľno</span>')+'</div>';});});
      $('calendarGrid').innerHTML=html;
      $('mobileJobList').innerHTML=jobs.length?jobs.sort((a,b)=>(a.date+a.startTime).localeCompare(b.date+b.startTime)).map(j=>jobCard(j,true)).join(''):'<span class="muted">Na tento týždeň nemáš pridelené žiadne vozidlá.</span>';
    }
    function jobCard(j,mobile=false){const v=vehicle(j.vehicleId),m=mechanic(j.mechanicId);return `<div class="job status-${esc(j.status)}" ${mobile?'style="margin-bottom:10px"':''}><strong>${esc(v.plate||'Bez ŠPZ')} · ${esc((v.make||'')+' '+(v.model||''))}</strong><div class="time">${esc(j.date)} · ${esc(j.startTime)}–${esc(j.endTime)}${mobile?' · '+esc(m.name):''}</div><div>${esc(j.task)}</div><div style="margin-top:5px"><span class="badge ${j.status==='Dokončené'?'done':j.status==='Rozpracované'?'work':''}">${esc(j.status)}</span></div>${me.role==='admin'?`<button class="btn secondary small" style="margin-top:6px" onclick="editJob('${j.id}')">Upraviť</button>`:`<select style="margin-top:7px;padding:5px;font-size:11px" onchange="statusChange('${j.id}',this.value)">${['Naplánované','Rozpracované','Dokončené'].map(s=>`<option ${j.status===s?'selected':''}>${s}</option>`).join('')}</select>`}</div>`;}
    function renderVehicles(){if(me.role!=='admin')return;let rows=data.vehicles.map(v=>`<tr><td><b>${esc(v.plate)}</b></td><td>${esc(v.make)} ${esc(v.model)}</td><td>${esc(v.customer)}</td><td>${esc(v.phone)}</td><td>${esc(v.note)}</td><td><button class="btn secondary small" onclick="editVehicle('${v.id}')">Upraviť</button></td></tr>`).join('');$('vehicleTable').innerHTML=`<table><thead><tr><th>ŠPZ</th><th>Vozidlo</th><th>Zákazník</th><th>Telefón</th><th>Poznámka</th><th></th></tr></thead><tbody>${rows||'<tr><td colspan="6">Zatiaľ nie sú pridané vozidlá.</td></tr>'}</tbody></table>`;}
    function renderMechanics(){if(me.role!=='admin')return;let rows=data.mechanics.map(m=>`<tr><td><b>${esc(m.name)}</b></td><td>${esc(m.username)}</td><td><span class="badge">Mechanik</span></td><td><button class="btn secondary small" onclick="editMechanic('${m.id}')">Upraviť</button></td></tr>`).join('');$('mechanicTable').innerHTML=`<table><thead><tr><th>Meno</th><th>Prihlasovacie meno</th><th>Rola</th><th></th></tr></thead><tbody>${rows||'<tr><td colspan="4">Zatiaľ nie sú pridaní mechanici.</td></tr>'}</tbody></table>`;}
    function openModal(title,html){$('modalTitle').textContent=title;$('modalBody').innerHTML=html;$('modalBack').classList.remove('hidden');}
    function closeModal(){$('modalBack').classList.add('hidden');}
    function openVehicle(v={}){openModal(v.id?'Upraviť vozidlo':'Pridať vozidlo',`<div class="formgrid"><div><label>ŠPZ *</label><input id="vPlate" value="${esc(v.plate||'')}"></div><div><label>Značka</label><input id="vMake" value="${esc(v.make||'')}"></div><div><label>Model</label><input id="vModel" value="${esc(v.model||'')}"></div><div><label>Zákazník</label><input id="vCustomer" value="${esc(v.customer||'')}"></div><div><label>Telefón</label><input id="vPhone" value="${esc(v.phone||'')}"></div><div class="span2"><label>Poznámka</label><textarea id="vNote">${esc(v.note||'')}</textarea></div></div><div class="modalactions">${v.id?`<button class="btn danger" onclick="removeVehicle('${v.id}')">Odstrániť</button>`:''}<button class="btn" onclick="saveVehicleForm('${v.id||''}')">Uložiť</button></div>`);}
    function editVehicle(id){openVehicle(vehicle(id));}
    async function saveVehicleForm(id){const v={id:id||undefined,plate:$('vPlate').value,make:$('vMake').value,model:$('vModel').value,customer:$('vCustomer').value,phone:$('vPhone').value,note:$('vNote').value};try{await call('saveVehicle',token,v);closeModal();await loadData();}catch(e){alert(e.message);}}
    async function removeVehicle(id){if(!confirm('Naozaj odstrániť vozidlo?'))return;try{await call('deleteVehicle',token,id);closeModal();await loadData();}catch(e){alert(e.message);}}
    function openMechanic(m={}){openModal(m.id?'Upraviť mechanika':'Pridať mechanika',`<label>Meno mechanika *</label><input id="mName" value="${esc(m.name||'')}"><label>Prihlasovacie meno *</label><input id="mUser" value="${esc(m.username||'')}"><label>${m.id?'Nové heslo (nechaj prázdne, ak sa nemení)':'Heslo (min. 8 znakov) *'}</label><input id="mPass" type="password"><div class="modalactions"><button class="btn" onclick="saveMechanicForm('${m.id||''}')">Uložiť</button></div>`);}
    function editMechanic(id){openMechanic(data.mechanics.find(m=>m.id===id));}
    async function saveMechanicForm(id){try{await call('saveMechanic',token,{id:id||undefined,name:$('mName').value,username:$('mUser').value,password:$('mPass').value});closeModal();await loadData();}catch(e){alert(e.message);}}
    function openJob(j={}){const today=dateKey(new Date());const vehicleOpts=data.vehicles.map(v=>`<option value="${v.id}" ${j.vehicleId===v.id?'selected':''}>${esc(v.plate)} – ${esc(v.make)} ${esc(v.model)}</option>`).join('');const mechOpts=data.mechanics.map(m=>`<option value="${m.id}" ${j.mechanicId===m.id?'selected':''}>${esc(m.name)}</option>`).join('');openModal(j.id?'Upraviť zákazku':'Naplánovať vozidlo',`<div class="formgrid"><div><label>Dátum *</label><input id="jDate" type="date" value="${esc(j.date||today)}"></div><div><label>Mechanik *</label><select id="jMechanic"><option value="">Vyber mechanika</option>${mechOpts}</select></div><div><label>Vozidlo *</label><select id="jVehicle"><option value="">Vyber vozidlo</option>${vehicleOpts}</select></div><div><label>Stav</label><select id="jStatus">${['Naplánované','Rozpracované','Dokončené'].map(s=>`<option ${j.status===s?'selected':''}>${s}</option>`).join('')}</select></div><div><label>Od</label><input id="jStart" type="time" value="${esc(j.startTime||'08:00')}"></div><div><label>Do</label><input id="jEnd" type="time" value="${esc(j.endTime||'16:00')}"></div><div class="span2"><label>Popis práce *</label><textarea id="jTask">${esc(j.task||'')}</textarea></div></div><div class="modalactions">${j.id?`<button class="btn danger" onclick="removeJob('${j.id}')">Odstrániť</button>`:''}<button class="btn" onclick="saveJobForm('${j.id||''}')">Uložiť zákazku</button></div>`);}
    function editJob(id){openJob(data.jobs.find(j=>j.id===id));}
    async function saveJobForm(id){const j={id:id||undefined,date:$('jDate').value,mechanicId:$('jMechanic').value,vehicleId:$('jVehicle').value,status:$('jStatus').value,startTime:$('jStart').value,endTime:$('jEnd').value,task:$('jTask').value};try{await call('saveJob',token,j);closeModal();await loadData();}catch(e){alert(e.message);}}
    async function removeJob(id){if(!confirm('Odstrániť túto zákazku?'))return;try{await call('deleteJob',token,id);closeModal();await loadData();}catch(e){alert(e.message);}}
    async function statusChange(id,status){try{await call('updateJobStatus',token,id,status);await loadData();}catch(e){alert(e.message);}}
    async function changePassword(){try{await call('setMyPassword',token,$('oldPass').value,$('newPass').value);$('oldPass').value='';$('newPass').value='';alert('Heslo bolo zmenené.');}catch(e){alert(e.message);}}
    if(token){loadData();}
  </script>
</body>
</html>
